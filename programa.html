<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa — tono.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.phero { padding: calc(var(--nav-h) + 40px) 0 70px; }
.phero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items: start; }
@media (max-width: 960px) { .phero-grid { grid-template-columns: 1fr; gap: 36px; } }
.cover { border-radius: var(--r); overflow: hidden; aspect-ratio: 16/10; box-shadow: var(--sombra); position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover .tag { position: absolute; top: 16px; left: 16px; background: rgba(36,27,43,.8); color: var(--crema); backdrop-filter: blur(6px); font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; }
.migas { font-size: .88rem; color: var(--tinta-60); margin-bottom: 22px; }
.migas a:hover { color: var(--tinta); }
.pinfo h1 { font-size: clamp(2rem, 4.2vw, 3.2rem); font-weight: 800; margin: 8px 0 14px; }
.pinfo .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--tinta-60); font-size: .95rem; margin-bottom: 18px; }
.pinfo .desc { font-size: 1.06rem; margin-bottom: 26px; max-width: 56ch; }
.inst-mini { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1.5px solid var(--linea); border-radius: var(--r-sm); background: var(--blanco); margin-bottom: 26px; }
.inst-mini img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.inst-mini b { display: block; }
.inst-mini span { font-size: .85rem; color: var(--tinta-60); }
.inst-mini a { margin-left: auto; font-weight: 600; font-size: .9rem; color: var(--coral); white-space: nowrap; }
.compra { background: var(--blanco); border-radius: var(--r); padding: 26px; box-shadow: var(--sombra); }
.compra .precio-g { font-family: var(--f-display); font-size: 2.4rem; font-weight: 800; }
.compra .iva { font-size: .82rem; color: var(--tinta-60); margin-bottom: 18px; }
.compra ul { list-style: none; margin: 18px 0 22px; }
.compra li { padding: 7px 0; display: flex; gap: 10px; font-size: .95rem; }
.compra li::before { content: '✓'; color: var(--ok); font-weight: 700; }
.compra .btn { width: 100%; }
.compra .ya { background: rgba(62,155,108,.1); color: var(--ok); border-radius: var(--r-sm); padding: 12px 16px; font-weight: 600; font-size: .92rem; text-align: center; margin-bottom: 14px; }
.material { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 14px 16px; border: 1.5px dashed var(--linea); border-radius: var(--r-sm); font-size: .9rem; }
.material .pdf { background: var(--coral); color: #fff; font-size: .68rem; font-weight: 800; padding: 5px 8px; border-radius: 6px; }
/* temario */
.temario { max-width: 820px; }
.sem { border: 1.5px solid var(--linea); border-radius: var(--r-sm); background: var(--blanco); margin-bottom: 14px; overflow: hidden; }
.sem summary { list-style: none; cursor: pointer; padding: 18px 22px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-family: var(--f-display); font-size: 1.08rem; }
.sem summary::-webkit-details-marker { display: none; }
.sem summary .n { color: var(--coral); }
.sem summary .flecha { margin-left: auto; transition: transform .2s; color: var(--tinta-60); }
.sem[open] summary .flecha { transform: rotate(180deg); }
.sem .lec { display: flex; align-items: center; gap: 14px; padding: 13px 22px; border-top: 1px solid var(--linea); font-size: .95rem; }
.sem .lec .lock { color: var(--tinta-30); }
.sem .lec .dur { margin-left: auto; color: var(--tinta-60); font-size: .85rem; }
.sem .lec.libre { color: var(--tinta); }
.sem .lec.libre .lock { color: var(--ok); }
</style>
</head>
<body>

<section class="phero">
  <div class="wrap">
    <div class="migas" id="migas"></div>
    <div class="phero-grid">
      <div>
        <div class="cover rv in"><img id="cover" src="" alt=""><span class="tag" id="tagCat"></span></div>
        <div class="inst-mini" style="margin-top:26px" id="instMini"></div>
        <div class="pinfo">
          <h1 id="titulo"></h1>
          <div class="meta" id="meta"></div>
          <p class="desc" id="desc"></p>
        </div>
      </div>
      <aside class="compra" id="compra"></aside>
    </div>
  </div>
</section>

<section class="sec" style="padding-top:20px">
  <div class="wrap">
    <div class="sec-head rv">
      <div>
        <div class="kicker">Contenido del programa</div>
        <h2>Semana a semana</h2>
      </div>
      <p class="sec-sub">La primera clase es gratis. El resto se desbloquea automáticamente con tu compra.</p>
    </div>
    <div class="temario" id="temario"></div>
  </div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
montarUI({});

const p = findP(param('p')) || PROGRAMAS[0];
const inst = findI(p.instructor);
document.title = p.titulo + ' — tono.';

document.getElementById('migas').innerHTML =
  `<a href="index.html">Inicio</a> / <a href="explorar.html?cat=${p.cat}">${catLabel(p.cat)}</a> / ${p.titulo}`;
document.getElementById('cover').src = p.img;
document.getElementById('cover').alt = p.titulo;
document.getElementById('tagCat').textContent = catLabel(p.cat);
document.getElementById('titulo').textContent = p.titulo;
document.getElementById('meta').innerHTML =
  `<span>★ ${p.rating} (${p.alumnos} alumnos)</span><span>·</span><span>${p.semanas} semanas</span><span>·</span><span>${p.sesiones} clases de ~${p.min} min</span><span>·</span><span>${p.nivel}</span>`;
document.getElementById('desc').textContent = p.desc;
document.getElementById('instMini').innerHTML = `
  <img src="${inst.img}" alt="${inst.nombre}">
  <div><b>${inst.nombre}</b><span>${inst.rol} · ★ ${inst.rating}</span></div>
  <a href="instructor.html?i=${inst.slug}">Ver perfil →</a>`;

function renderCompra() {
  const ya = TONO.tiene(p.slug);
  document.getElementById('compra').innerHTML = `
    ${ya ? '<div class="ya">✓ Ya tienes este programa</div>' : ''}
    <div class="precio-g">${$fmt(p.precio)}</div>
    <div class="iva">Pago único · exento de IVA · acceso inmediato</div>
    ${ya
      ? `<a class="btn btn-coral" href="clase.html?p=${p.slug}">Continuar entrenando</a>`
      : `<a class="btn btn-coral" href="${TONO.user ? 'checkout.html?p=' + p.slug : 'acceso.html?next=' + encodeURIComponent('checkout.html?p=' + p.slug)}">Comprar programa</a>`}
    <ul>${p.incluye.map(i => '<li>' + i + '</li>').join('')}</ul>
    <div class="material"><span class="pdf">PDF</span> ${p.material}</div>`;
}
renderCompra();

const semanas = leccionesDe(p);
document.getElementById('temario').innerHTML = semanas.map((s, si) => `
  <details class="sem rv in" ${si === 0 ? 'open' : ''}>
    <summary><span class="n">Semana ${s.semana}</span> ${si === 0 ? 'Fundamentos y arranque' : si === semanas.length - 1 ? 'Cierre y consolidación' : 'Progresión'} <span class="flecha">▾</span></summary>
    ${s.lecciones.map((l, li) => {
      const libre = si === 0 && li === 0;
      return `<div class="lec ${libre ? 'libre' : ''}">
        <span class="lock">${libre ? '▶' : (TONO.tiene(p.slug) ? '▶' : '🔒')}</span>
        ${l.titulo} ${libre ? '<span style="color:var(--ok);font-weight:700;font-size:.8rem">GRATIS</span>' : ''}
        <span class="dur">${l.dur}</span>
      </div>`;
    }).join('')}
  </details>`).join('');
</script>
</body>
</html>
